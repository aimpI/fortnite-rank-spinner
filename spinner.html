<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#container {
    width: 100%;
    height: 120px;
    display: flex;
    align-items: center;
    position: relative;
}

#track {
    display: flex;
    gap: 10px;
    position: absolute;
    left: 50%;
    transform: translateX(0);
    transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
}

.item {
    width: 100px;
    height: 100px;
    background: #1e1e1e;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 12px;
    border: 3px solid transparent;
}

.item img {
    width: 50px;
    height: 50px;
}

.center-marker {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 0;
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 20px solid yellow;
}
</style>
</head>

<body>

<div id="container">
    <div class="center-marker"></div>
    <div id="track"></div>
</div>

<script>
const ranks = [
"Unranked","Bronze I","Bronze II","Bronze III",
"Silver I","Silver II","Silver III",
"Gold I","Gold II","Gold III",
"Platinum I","Platinum II","Platinum III",
"Diamond I","Diamond II","Diamond III",
"Elite","Champion","Unreal"
];

// Duplicate for smooth scrolling
let fullList = [];
for (let i = 0; i < 5; i++) fullList = fullList.concat(ranks);

const track = document.getElementById("track");

// Create items
fullList.forEach(rank => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<div>${rank}</div>`;
    track.appendChild(div);
});

// Listen for spin trigger
window.addEventListener("message", (event) => {
    if (event.data.type === "spin") {
        spin(event.data.result);
    }
});

function spin(result) {
    const index = fullList.lastIndexOf(result);
    const itemWidth = 110;

    const offset = (index * itemWidth);
    track.style.transform = `translateX(${-offset}px)`;
}
</script>

</body>
</html>
