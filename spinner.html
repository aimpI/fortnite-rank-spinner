<head>
<meta charset="UTF-8">
<title>Fortnite Spinner</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

/* Container */
#container {
    width: 100%;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

/* Track */
#track {
    display: flex;
    gap: 12px;
    position: absolute;
    left: 50%;
    transform: translateX(0);
    transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
}

/* Items */
.item {
    width: 110px;
    height: 110px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: white;
    text-align: center;
    font-size: 13px;
    border: 3px solid rgba(255,255,255,0.2);
    position: relative;
}

/* Center highlight */
.center-box {
    position: absolute;
    width: 120px;
    height: 120px;
    border: 4px solid yellow;
    border-radius: 14px;
    pointer-events: none;
    box-shadow: 0 0 20px yellow;
    z-index: 10;
}

/* Win popup */
#win-popup {
    position: absolute;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    font-size: 18px;
    border-radius: 10px;
    display: none;
    text-align: center;
    z-index: 20;
    box-shadow: 0 0 15px gold;
    animation: popupAnim 1s ease forwards;
}

@keyframes popupAnim {
    0% {opacity: 0; transform: translate(-50%, -20px);}
    50% {opacity: 1; transform: translate(-50%, 0);}
    100% {opacity: 1; transform: translate(-50%, -20px);}
}

/* Fortnite-style gradients for each rank */
.Bronze {
    background: linear-gradient(135deg, #B87333, #FF9933); /* warm copper → orange highlight */
}
.Silver {
    background: linear-gradient(135deg, #C0C0C0, #E0E0E0); /* metallic gray → reflective steel */
    color: black;
}
.Gold {
    background: linear-gradient(135deg, #FFD700, #FFFACD); /* bright gold → luminous yellow */
    color: black;
}
.Platinum {
    background: linear-gradient(135deg, #66FFFF, #99FFFF); /* aqua blue → light platinum */
    color: black;
}
.Diamond {
    background: linear-gradient(135deg, #4BB7E0, #A0E0FF); /* icy blue → crystalline highlights */
}
.Elite {
    background: linear-gradient(135deg, #2F4F4F, #008080); /* dark charcoal → teal accents */
}
.Champion {
    background: linear-gradient(135deg, #B22222, #FFD700); /* red → gold accent combo */
}
.Unreal {
    background: linear-gradient(135deg, #8A2BE2, #4B0082, #DA70D6); /* violet → blue-purple gradient */
}

/* Icon inside item */
.item img {
    width: 50px;
    height: 50px;
    margin-bottom: 5px;
}
</style>
</head>
<body>

<div id="container">
    <div class="center-box"></div>
    <div id="track"></div>
    <div id="win-popup"></div>
</div>

<!-- Sounds -->
<audio id="spin-sound" src="https://freesound.org/data/previews/502/502538_10226544-lq.mp3"></audio>
<audio id="win-sound" src="https://freesound.org/data/previews/343/343909_624445-lq.mp3"></audio>

<script>
// Ranks with icons (replace URLs with your own PNGs if desired)
const ranks = [
  {name: "Bronze", icon: "https://i.imgur.com/0XnH7mB.png"},
  {name: "Silver", icon: "https://i.imgur.com/8c0HcwR.png"},
  {name: "Gold", icon: "https://i.imgur.com/9M2Jv7I.png"},
  {name: "Platinum", icon: "https://i.imgur.com/ehZxH8b.png"},
  {name: "Diamond", icon: "https://i.imgur.com/j5r5iyt.png"},
  {name: "Elite", icon: "https://i.imgur.com/PfjzYWe.png"},
  {name: "Champion", icon: "https://i.imgur.com/FFG2m5x.png"},
  {name: "Unreal", icon: "https://i.imgur.com/xz0Xk0G.png"}
];

// Duplicate for smooth scroll
let fullList = [];
for(let i=0;i<6;i++) fullList = fullList.concat(ranks);

const track = document.getElementById("track");

// Create items
fullList.forEach(rank => {
    const div = document.createElement("div");
    div.className = "item";

    // Add color class
    div.classList.add(rank.name);

    // Add icon and name
    const img = document.createElement("img");
    img.src = rank.icon;
    div.appendChild(img);
    const span = document.createElement("span");
    span.innerText = rank.name;
    div.appendChild(span);

    track.appendChild(div);
});

// Spin logic
const spinSound = document.getElementById("spin-sound");
const winSound = document.getElementById("win-sound");
const winPopup = document.getElementById("win-popup");

window.addEventListener("message", (event) => {
    if(event.data.type === "spin") spin(event.data.result);
});

function spin(result) {
    const itemWidth = 122;
    const index = fullList.lastIndexOf(fullList.find(r => r.name===result));
    const offset = (index * itemWidth) - (window.innerWidth / 2 - 60);

    spinSound.currentTime = 0;
    spinSound.play();

    track.style.transition = "none";
    track.style.transform = "translateX(0px)";

    setTimeout(() => {
        track.style.transition = "transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)";
        track.style.transform = `translateX(${-offset}px)`;
    }, 50);

    // Show popup after spin
    setTimeout(() => {
        winPopup.innerText = `You got ${result}!`;
        winPopup.style.display = "block";
        winSound.currentTime = 0;
        winSound.play();
        setTimeout(() => winPopup.style.display = "none", 2000);
    }, 4200);
}
</script>
</body>
</html>
