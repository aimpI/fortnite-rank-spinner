<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fortnite Spinner</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

/* Container */
#container {
    width: 100%;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

/* Track */
#track {
    display: flex;
    gap: 12px;
    position: absolute;
    left: 50%;
    transform: translateX(0);
    transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
}

/* Items */
.item {
    width: 110px;
    height: 110px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: white;
    text-align: center;
    font-size: 13px;
    border: 3px solid rgba(255,255,255,0.2);
    outline: 4px solid rgba(255,255,255,0.3); /* shadowless outer border */
    outline-offset: 4px;
    position: relative;
}

/* Center highlight */
.center-box {
    position: absolute;
    width: 120px;
    height: 120px;
    border: 4px solid yellow;
    border-radius: 14px;
    pointer-events: none;
    box-shadow: 0 0 20px yellow;
    z-index: 10;
}

/* Win popup overlay */
#win-popup {
    position: absolute;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    font-size: 18px;
    border-radius: 10px;
    display: none;
    text-align: center;
    z-index: 20;
    box-shadow: 0 0 15px gold;
    animation: popupAnim 1s ease forwards;
}

@keyframes popupAnim {
    0% {opacity: 0; transform: translate(-50%, -20px);}
    50% {opacity: 1; transform: translate(-50%, 0);}
    100% {opacity: 1; transform: translate(-50%, -20px);}
}

/* Fortnite-style gradients for each rank */
.Bronze { background: linear-gradient(135deg, #B87333, #FF9933); }
.Silver { background: linear-gradient(135deg, #C0C0C0, #E0E0E0); color: black; }
.Gold { background: linear-gradient(135deg, #FFD700, #FFFACD); color: black; }
.Platinum { background: linear-gradient(135deg, #66FFFF, #99FFFF); color: black; }
.Diamond { background: linear-gradient(135deg, #4BB7E0, #A0E0FF); }
.Elite { background: linear-gradient(135deg, #2F4F4F, #008080); }
.Champion { background: linear-gradient(135deg, #B22222, #FFD700); }
.Unreal { background: linear-gradient(135deg, #8A2BE2, #4B0082, #DA70D6); }

/* Icon inside item */
.item img { width: 50px; height: 50px; margin-bottom: 5px; }

/* Spin button for testing outside OBS */
#spin-btn {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 25px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: gold;
    color: black;
    cursor: pointer;
}
#spin-btn:hover { background: #FFD700; }
</style>
</head>
<body>

<div id="container">
    <div class="center-box"></div>
    <div id="track"></div>
    <div id="win-popup"></div>
</div>

<button id="spin-btn">Spin!</button>

<!-- Sounds -->
<audio id="spin-sound" src="https://freesound.org/data/previews/502/502538_10226544-lq.mp3"></audio>
<audio id="win-sound" src="https://freesound.org/data/previews/343/343909_624445-lq.mp3"></audio>

<script>
// Ranks
const ranks = [
  {name: "Bronze", icon: "https://i.imgur.com/0XnH7mB.png"},
  {name: "Silver", icon: "https://i.imgur.com/8c0HcwR.png"},
  {name: "Gold", icon: "https://i.imgur.com/9M2Jv7I.png"},
  {name: "Platinum", icon: "https://i.imgur.com/ehZxH8b.png"},
  {name: "Diamond", icon: "https://i.imgur.com/j5r5iyt.png"},
  {name: "Elite", icon: "https://i.imgur.com/PfjzYWe.png"},
  {name: "Champion", icon: "https://i.imgur.com/FFG2m5x.png"},
  {name: "Unreal", icon: "https://i.imgur.com/xz0Xk0G.png"}
];

// Duplicate list for looping effect
let fullList = [];
for(let i=0;i<6;i++) fullList = fullList.concat(ranks);

const track = document.getElementById("track");

// Create spinner items
fullList.forEach(rank => {
    const div = document.createElement("div");
    div.className = "item " + rank.name;
    const img = document.createElement("img");
    img.src = rank.icon;
    div.appendChild(img);
    const span = document.createElement("span");
    span.innerText = rank.name;
    div.appendChild(span);
    track.appendChild(div);
});

// Spin logic
const spinSound = document.getElementById("spin-sound");
const winSound = document.getElementById("win-sound");
const winPopup = document.getElementById("win-popup");

function spin(result, user="Someone") {
    const itemWidth = 122; // width + gap
    const index = fullList.lastIndexOf(fullList.find(r => r.name===result));
    const offset = (index * itemWidth) - (window.innerWidth / 2 - 60);

    spinSound.currentTime = 0;
    spinSound.play();

    track.style.transition = "none";
    track.style.transform = "translateX(0px)";

    setTimeout(() => {
        track.style.transition = "transform 4s cubic-bezier(0.1,0.7,0.1,1)";
        track.style.transform = `translateX(${-offset}px)`;
    }, 50);

    setTimeout(() => {
        winPopup.innerText = `${user} is ${result}!`;
        winPopup.style.display = "block";
        winSound.currentTime = 0;
        winSound.play();
        setTimeout(() => winPopup.style.display = "none", 2000);
    }, 4200);
}

// Random spin function for testing outside OBS
function spinRandom() {
    const randomIndex = Math.floor(Math.random() * ranks.length);
    spin(ranks[randomIndex].name);
}

document.getElementById("spin-btn").addEventListener("click", spinRandom);

// Listen for C# / OBS events
window.addEventListener("message", (event) => {
    if(event.data.type === "spin") {
        const result = event.data.result;
        const user = event.data.user || "Someone";
        spin(result, user);
    }
});
</script>
</body>
</html>
