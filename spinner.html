<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fortnite Spinner</title>

<style>
body { margin: 0; overflow: hidden; background: transparent; font-family: Arial, sans-serif; }

#container {
    width: 100%;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    opacity: 0;
    transition: opacity 0.4s ease;
}

#track {
    display: flex;
    gap: 12px;
    position: absolute;
    left: 0;
    transform: translateX(0);
}

.item {
    width: 110px;
    height: 110px;
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    background: #111;
}

.item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
}

.item::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 18px;
    z-index: -1;
    filter: blur(8px);
    opacity: 0.9;
}

.item::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.15);
}

.Bronze::before { background: linear-gradient(135deg, #B87333, #FF9933); }
.Silver::before { background: linear-gradient(135deg, #C0C0C0, #E0E0E0); }
.Gold::before { background: linear-gradient(135deg, #FFD700, #FFFACD); }
.Platinum::before { background: linear-gradient(135deg, #66FFFF, #99FFFF); }
.Diamond::before { background: linear-gradient(135deg, #4BB7E0, #A0E0FF); }
.Elite::before { background: linear-gradient(135deg, #2F4F4F, #008080); }
.Champion::before { background: linear-gradient(135deg, #B22222, #FFD700); }
.Unreal::before { background: linear-gradient(135deg, #8A2BE2, #4B0082, #DA70D6); }

.winner {
    transform: scale(1.2);
    transition: transform 0.3s ease;
    z-index: 20;
}

.center-box {
    position: absolute;
    width: 122px;
    height: 122px;
    border: 4px solid red;
    border-radius: 14px;
    pointer-events: none;
    box-shadow: 0 0 20px red;
    z-index: 10;
}

#win-popup {
    position: absolute;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    font-size: 18px;
    border-radius: 10px;
    display: none;
    z-index: 20;
}
</style>
</head>

<body>

<div id="container">
    <div class="center-box"></div>
    <div id="track"></div>
    <div id="win-popup"></div>
</div>

<audio id="spin-sound" src="https://freesound.org/data/previews/502/502538_10226544-lq.mp3"></audio>
<audio id="tick-sound" src="https://freesound.org/data/previews/256/256113_3263906-lq.mp3"></audio>
<audio id="win-sound" src="https://freesound.org/data/previews/343/343909_624445-lq.mp3"></audio>

<script>
const ranks = [
  {name: "Bronze", icon: "https://i.imgur.com/iY0Zmmw.jpeg"},
  {name: "Silver", icon: "https://i.imgur.com/jD8WHLV.jpeg"},
  {name: "Gold", icon: "https://i.imgur.com/BFr63N1.jpeg"},
  {name: "Platinum", icon: "https://i.imgur.com/ApqmCS7.jpeg"},
  {name: "Diamond", icon: "https://i.imgur.com/WafDzae.jpeg"},
  {name: "Elite", icon: "https://i.imgur.com/CT0rFuy.jpeg"},
  {name: "Champion", icon: "https://i.imgur.com/wsbc2th.jpeg"},
  {name: "Unreal", icon: "https://i.imgur.com/AYIvINF.jpeg"}
];

let fullList = [];
for(let i=0;i<10;i++) fullList = fullList.concat(ranks);

const track = document.getElementById("track");

fullList.forEach(rank => {
    const div = document.createElement("div");
    div.className = "item " + rank.name;

    const img = document.createElement("img");
    img.src = rank.icon;

    div.appendChild(img);
    track.appendChild(div);
});

const gap = 12;
const item = document.querySelector(".item");
const itemWidth = item.offsetWidth;

const container = document.getElementById("container");
const centerStart = (container.offsetWidth / 2) - (itemWidth / 2);
track.style.transform = `translateX(${centerStart}px)`;

const spinSound = document.getElementById("spin-sound");
const tickSound = document.getElementById("tick-sound");
const winSound = document.getElementById("win-sound");
const winPopup = document.getElementById("win-popup");

// 🔥 QUEUE
let queue = [];
let isSpinning = false;

function showSpinner() {
    container.style.opacity = "1";
}

function hideSpinner() {
    container.style.opacity = "0";
}

function processQueue() {
    if (isSpinning || queue.length === 0) return;

    isSpinning = true;

    const { user, result } = queue.shift();

    showSpinner();
    spin(result, user);
}

function spin(result, user="Someone") {

    const centerBox = document.querySelector(".center-box");

    const containerRect = container.getBoundingClientRect();
    const boxRect = centerBox.getBoundingClientRect();
    const boxCenter = boxRect.left - containerRect.left + (boxRect.width / 2);

    const baseIndex = ranks.findIndex(r => r.name === result);
    const loops = 5;
    const index = loops * ranks.length + baseIndex;

    const totalWidth = itemWidth + gap;
    const targetX = index * totalWidth;
    const finalOffset = targetX - boxCenter + (itemWidth / 2);

    spinSound.currentTime = 0;
    spinSound.play();

    track.style.transition = "none";
    track.style.transform = `translateX(${centerStart}px)`;

    let blurAmount = 10;
    track.style.filter = `blur(${blurAmount}px)`;

    let blurInterval = setInterval(() => {
        blurAmount *= 0.92;
        if (blurAmount <= 0.3) {
            track.style.filter = "blur(0px)";
            clearInterval(blurInterval);
        } else {
            track.style.filter = `blur(${blurAmount}px)`;
        }
    }, 50);

    let speed = 50;
    let tickInterval = setInterval(function tick() {
        tickSound.currentTime = 0;
        tickSound.play();
        speed += 15;
        clearInterval(tickInterval);
        tickInterval = setInterval(tick, speed);
    }, speed);

    setTimeout(() => {
        track.style.transition = "transform 4.5s cubic-bezier(0.15,0.85,0.25,1)";
        track.style.transform = `translateX(${-finalOffset}px)`;
    }, 50);

    setTimeout(() => {
        clearInterval(tickInterval);
        track.style.filter = "blur(0px)";
    }, 4500);

    setTimeout(() => {
        const items = document.querySelectorAll(".item");

        let closestItem = null;
        let closestDistance = Infinity;

        items.forEach(el => {
            const rect = el.getBoundingClientRect();
            const center = rect.left + rect.width / 2;
            const dist = Math.abs(center - boxCenter);

            if (dist < closestDistance) {
                closestDistance = dist;
                closestItem = el;
            }
        });

        if (closestItem) closestItem.classList.add("winner");

        winPopup.innerText = `${user} is ${result}!`;
        winPopup.style.display = "block";

        winSound.currentTime = 0;
        winSound.play();

        setTimeout(() => {
            winPopup.style.display = "none";
            if (closestItem) closestItem.classList.remove("winner");
        }, 2000);

    }, 4600);

    setTimeout(() => {
        track.style.transition = "none";

        const resetIndex = baseIndex + ranks.length * 2;
        const resetX = resetIndex * (itemWidth + gap) - boxCenter + (itemWidth / 2);

        track.style.transform = `translateX(${-resetX}px)`;

    }, 4700);

    setTimeout(() => {
        hideSpinner();
        isSpinning = false;
        processQueue();
    }, 7000);
}

// 🎯 FOLLOW EVENT
window.addEventListener("onEventReceived", function (obj) {

    if (obj.detail.listener === "follow") {

        const user = obj.detail.event.uniqueId || "Someone";
        const randomRank = ranks[Math.floor(Math.random() * ranks.length)].name;

        queue.push({ user, result: randomRank });

        processQueue();
    }

});
</script>

</body>
</html>
