<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fortnite Spinner</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

/* Container */
#container {
    width: 100%;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

/* Track */
#track {
    display: flex;
    gap: 12px;
    position: absolute;
    left: 50%;
    transform: translateX(0);
    transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
}

/* Items */
.item {
    width: 110px;
    height: 110px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: white;
    text-align: center;
    font-size: 13px;
    border: 3px solid rgba(255,255,255,0.2);
    background: #444;
    position: relative;
}

/* Center highlight */
.center-box {
    position: absolute;
    width: 120px;
    height: 120px;
    border: 4px solid yellow;
    border-radius: 14px;
    pointer-events: none;
    box-shadow: 0 0 20px yellow;
    z-index: 10;
}

/* Win popup */
#win-popup {
    position: absolute;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    font-size: 18px;
    border-radius: 10px;
    display: none;
    text-align: center;
    z-index: 20;
    box-shadow: 0 0 15px gold;
    animation: popupAnim 1s ease forwards;
}

@keyframes popupAnim {
    0% {opacity: 0; transform: translate(-50%, -20px);}
    50% {opacity: 1; transform: translate(-50%, 0);}
    100% {opacity: 1; transform: translate(-50%, -20px);}
}

/* Fortnite-style colors */
.Unranked { background: #444; }
.Bronze { background: #cd7f32; }
.Silver { background: #c0c0c0; }
.Gold { background: #ffd700; color: black; }
.Platinum { background: #00e5ff; color: black; }
.Diamond { background: #4fc3f7; }
.Elite { background: #9c27b0; }
.Champion { background: #ff4081; }
.Unreal { 
    background: linear-gradient(45deg, red, orange, purple);
    box-shadow: 0 0 15px rgba(255,0,255,0.8);
}

/* Icon inside item */
.item img {
    width: 50px;
    height: 50px;
    margin-bottom: 5px;
}
</style>
</head>
<body>

<div id="container">
    <div class="center-box"></div>
    <div id="track"></div>
    <div id="win-popup"></div>
</div>

<!-- Sounds -->
<audio id="spin-sound" src="https://freesound.org/data/previews/502/502538_10226544-lq.mp3"></audio>
<audio id="win-sound" src="https://freesound.org/data/previews/343/343909_624445-lq.mp3"></audio>

<script>
// Ranks with icons (example images, replace with your own if you want)
const ranks = [
  {name: "Unranked", icon: "https://i.imgur.com/0XnH7mB.png"},
  {name: "Bronze I", icon: "https://i.imgur.com/0XnH7mB.png"},
  {name: "Bronze II", icon: "https://i.imgur.com/0XnH7mB.png"},
  {name: "Bronze III", icon: "https://i.imgur.com/0XnH7mB.png"},
  {name: "Silver I", icon: "https://i.imgur.com/8c0HcwR.png"},
  {name: "Silver II", icon: "https://i.imgur.com/8c0HcwR.png"},
  {name: "Silver III", icon: "https://i.imgur.com/8c0HcwR.png"},
  {name: "Gold I", icon: "https://i.imgur.com/9M2Jv7I.png"},
  {name: "Gold II", icon: "https://i.imgur.com/9M2Jv7I.png"},
  {name: "Gold III", icon: "https://i.imgur.com/9M2Jv7I.png"},
  {name: "Platinum I", icon: "https://i.imgur.com/ehZxH8b.png"},
  {name: "Platinum II", icon: "https://i.imgur.com/ehZxH8b.png"},
  {name: "Platinum III", icon: "https://i.imgur.com/ehZxH8b.png"},
  {name: "Diamond I", icon: "https://i.imgur.com/j5r5iyt.png"},
  {name: "Diamond II", icon: "https://i.imgur.com/j5r5iyt.png"},
  {name: "Diamond III", icon: "https://i.imgur.com/j5r5iyt.png"},
  {name: "Elite", icon: "https://i.imgur.com/PfjzYWe.png"},
  {name: "Champion", icon: "https://i.imgur.com/FFG2m5x.png"},
  {name: "Unreal", icon: "https://i.imgur.com/xz0Xk0G.png"}
];

// Duplicate for smooth scroll
let fullList = [];
for(let i=0;i<6;i++) fullList = fullList.concat(ranks);

const track = document.getElementById("track");

// Create items
fullList.forEach(rank => {
    const div = document.createElement("div");
    div.className = "item";

    // Add color class
    if(rank.name.includes("Bronze")) div.classList.add("Bronze");
    else if(rank.name.includes("Silver")) div.classList.add("Silver");
    else if(rank.name.includes("Gold")) div.classList.add("Gold");
    else if(rank.name.includes("Platinum")) div.classList.add("Platinum");
    else if(rank.name.includes("Diamond")) div.classList.add("Diamond");
    else if(rank.name.includes("Elite")) div.classList.add("Elite");
    else if(rank.name.includes("Champion")) div.classList.add("Champion");
    else if(rank.name.includes("Unreal")) div.classList.add("Unreal");
    else div.classList.add("Unranked");

    // Add icon and name
    const img = document.createElement("img");
    img.src = rank.icon;
    div.appendChild(img);
    const span = document.createElement("span");
    span.innerText = rank.name;
    div.appendChild(span);

    track.appendChild(div);
});

// Spin logic
const spinSound = document.getElementById("spin-sound");
const winSound = document.getElementById("win-sound");
const winPopup = document.getElementById("win-popup");

window.addEventListener("message", (event) => {
    if(event.data.type === "spin") spin(event.data.result);
});

function spin(result) {
    const itemWidth = 122;
    const index = fullList.lastIndexOf(fullList.find(r => r.name===result));

    const offset = (index * itemWidth) - (window.innerWidth / 2 - 60);

    spinSound.currentTime = 0;
    spinSound.play();

    track.style.transition = "none";
    track.style.transform = "translateX(0px)";

    setTimeout(() => {
        track.style.transition = "transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)";
        track.style.transform = `translateX(${-offset}px)`;
    }, 50);

    // Show popup after spin
    setTimeout(() => {
        winPopup.innerText = `You got ${result}!`;
        winPopup.style.display = "block";
        winSound.currentTime = 0;
        winSound.play();
        setTimeout(() => winPopup.style.display = "none", 2000);
    }, 4200);
}
</script>
</body>
</html>
