<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    margin: 0;
    overflow: hidden;
    background: transparent;
    font-family: Arial, sans-serif;
}

#container {
    width: 100%;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

/* Track */
#track {
    display: flex;
    gap: 12px;
    position: absolute;
    left: 50%;
    transform: translateX(0);
    transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
}

/* Items */
.item {
    width: 110px;
    height: 110px;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    color: white;
    text-align: center;
    font-size: 13px;
    border: 3px solid rgba(255,255,255,0.2);
}

/* Fortnite-style colors */
.Unranked { background: #444; }
.Bronze { background: #cd7f32; }
.Silver { background: #c0c0c0; }
.Gold { background: #ffd700; color: black; }
.Platinum { background: #00e5ff; color: black; }
.Diamond { background: #4fc3f7; }
.Elite { background: #9c27b0; }
.Champion { background: #ff4081; }
.Unreal { 
    background: linear-gradient(45deg, red, orange, purple);
    box-shadow: 0 0 15px rgba(255,0,255,0.8);
}

/* Center highlight */
.center-box {
    position: absolute;
    width: 120px;
    height: 120px;
    border: 4px solid yellow;
    border-radius: 14px;
    pointer-events: none;
    box-shadow: 0 0 20px yellow;
}
</style>
</head>

<body>

<div id="container">
    <div class="center-box"></div>
    <div id="track"></div>
</div>

<script>
const ranks = [
"Unranked",
"Bronze I","Bronze II","Bronze III",
"Silver I","Silver II","Silver III",
"Gold I","Gold II","Gold III",
"Platinum I","Platinum II","Platinum III",
"Diamond I","Diamond II","Diamond III",
"Elite","Champion","Unreal"
];

// Duplicate for smooth scroll
let fullList = [];
for (let i = 0; i < 6; i++) fullList = fullList.concat(ranks);

const track = document.getElementById("track");

// Create items
fullList.forEach(rank => {
    const div = document.createElement("div");
    div.className = "item";

    // Assign color class
    if (rank.includes("Bronze")) div.classList.add("Bronze");
    else if (rank.includes("Silver")) div.classList.add("Silver");
    else if (rank.includes("Gold")) div.classList.add("Gold");
    else if (rank.includes("Platinum")) div.classList.add("Platinum");
    else if (rank.includes("Diamond")) div.classList.add("Diamond");
    else if (rank.includes("Elite")) div.classList.add("Elite");
    else if (rank.includes("Champion")) div.classList.add("Champion");
    else if (rank.includes("Unreal")) div.classList.add("Unreal");
    else div.classList.add("Unranked");

    div.innerText = rank;
    track.appendChild(div);
});

// Listen for Streamer.bot event
window.addEventListener("message", (event) => {
    if (event.data.type === "spin") {
        spin(event.data.result);
    }
});

function spin(result) {
    const itemWidth = 122;
    const index = fullList.lastIndexOf(result);

    const offset = (index * itemWidth) - (window.innerWidth / 2 - 60);

    track.style.transition = "none";
    track.style.transform = "translateX(0px)";

    setTimeout(() => {
        track.style.transition = "transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)";
        track.style.transform = `translateX(${-offset}px)`;
    }, 50);
}
</script>

</body>
</html>
