<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fortnite Spinner</title>

<style>
body { margin: 0; overflow: hidden; background: transparent; font-family: Arial, sans-serif; }

#container {
    width: 100%;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

#track {
    display: flex;
    gap: 12px;
    position: absolute;
    left: 0;
    transform: translateX(0);
    filter: blur(0px);
}

/* CARD */
.item {
    width: 110px;
    height: 110px;
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    background: #111;
}

/* IMAGE FILLS CARD */
.item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
}

/* GLOW BORDER */
.item::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 18px;
    z-index: -1;
    filter: blur(8px);
    opacity: 0.9;
}

/* CLEAN BORDER */
.item::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.15);
}

/* GRADIENT GLOWS */
.Bronze::before { background: linear-gradient(135deg, #B87333, #FF9933); }
.Silver::before { background: linear-gradient(135deg, #C0C0C0, #E0E0E0); }
.Gold::before { background: linear-gradient(135deg, #FFD700, #FFFACD); }
.Platinum::before { background: linear-gradient(135deg, #66FFFF, #99FFFF); }
.Diamond::before { background: linear-gradient(135deg, #4BB7E0, #A0E0FF); }
.Elite::before { background: linear-gradient(135deg, #2F4F4F, #008080); }
.Champion::before { background: linear-gradient(135deg, #B22222, #FFD700); }
.Unreal::before { background: linear-gradient(135deg, #8A2BE2, #4B0082, #DA70D6); }

/* CENTER BOX */
.center-box {
    position: absolute;
    width: 122px;
    height: 122px;
    border: 4px solid red;
    border-radius: 14px;
    pointer-events: none;
    box-shadow: 0 0 20px red;
    z-index: 10;
}

/* POPUP */
#win-popup {
    position: absolute;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    font-size: 18px;
    border-radius: 10px;
    display: none;
    z-index: 20;
}

/* BUTTON */
#spin-btn {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 25px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: gold;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="container">
    <div class="center-box"></div>
    <div id="track"></div>
    <div id="win-popup"></div>
</div>

<button id="spin-btn">Spin!</button>

<!-- SOUNDS -->
<audio id="spin-sound" src="https://freesound.org/data/previews/502/502538_10226544-lq.mp3"></audio>
<audio id="tick-sound" src="https://freesound.org/data/previews/256/256113_3263906-lq.mp3"></audio>
<audio id="win-sound" src="https://freesound.org/data/previews/343/343909_624445-lq.mp3"></audio>

<script>
// 🔥 PASTE YOUR IMAGE LINKS HERE
const ranks = [
  {name: "Bronze", icon: "PASTE_IMAGE_LINK_HERE"},
  {name: "Silver", icon: "PASTE_IMAGE_LINK_HERE"},
  {name: "Gold", icon: "PASTE_IMAGE_LINK_HERE"},
  {name: "Platinum", icon: "PASTE_IMAGE_LINK_HERE"},
  {name: "Diamond", icon: "PASTE_IMAGE_LINK_HERE"},
  {name: "Elite", icon: "PASTE_IMAGE_LINK_HERE"},
  {name: "Champion", icon: "PASTE_IMAGE_LINK_HERE"},
  {name: "Unreal", icon: "PASTE_IMAGE_LINK_HERE"}
];

// Build track
let fullList = [];
for(let i=0;i<6;i++) fullList = fullList.concat(ranks);

const track = document.getElementById("track");

// Create items
fullList.forEach(rank => {
    const div = document.createElement("div");
    div.className = "item " + rank.name;

    const img = document.createElement("img");
    img.src = rank.icon;

    div.appendChild(img);
    track.appendChild(div);
});

const gap = 12;
const item = document.querySelector(".item");
const itemWidth = item.offsetWidth;

const container = document.getElementById("container");
const centerStart = (container.offsetWidth / 2) - (itemWidth / 2);
track.style.transform = `translateX(${centerStart}px)`;

// Sounds
const spinSound = document.getElementById("spin-sound");
const tickSound = document.getElementById("tick-sound");
const winSound = document.getElementById("win-sound");
const winPopup = document.getElementById("win-popup");

let tickInterval;

function spin(result, user="Someone") {

    const centerBox = document.querySelector(".center-box");

    const containerRect = container.getBoundingClientRect();
    const boxRect = centerBox.getBoundingClientRect();

    const boxCenter = boxRect.left - containerRect.left + (boxRect.width / 2);

    const index = fullList.map(r => r.name).lastIndexOf(result);

    const totalWidth = itemWidth + gap;
    const targetX = index * totalWidth;
    const finalOffset = targetX - boxCenter + (itemWidth / 2);

    spinSound.currentTime = 0;
    spinSound.play();

    // RESET
    track.style.transition = "none";
    track.style.transform = `translateX(${centerStart}px)`;

    // BLUR START
    track.style.filter = "blur(6px)";

    // TICK SYSTEM (slowdown)
    let speed = 50;
    tickInterval = setInterval(function tick() {
        tickSound.currentTime = 0;
        tickSound.play();
        speed += 15;
        clearInterval(tickInterval);
        tickInterval = setInterval(tick, speed);
    }, speed);

    setTimeout(() => {
        track.style.transition = "transform 4.5s cubic-bezier(0.15,0.85,0.25,1)";
        track.style.transform = `translateX(${-finalOffset}px)`;
    }, 50);

    // REMOVE BLUR
    setTimeout(() => {
        track.style.filter = "blur(0px)";
    }, 3500);

    // STOP TICKS
    setTimeout(() => {
        clearInterval(tickInterval);
    }, 4500);

    // WIN POPUP
    setTimeout(() => {
        winPopup.innerText = `${user} is ${result}!`;
        winPopup.style.display = "block";
        winSound.currentTime = 0;
        winSound.play();
        setTimeout(() => winPopup.style.display = "none", 2000);
    }, 4600);
}

// Button
document.getElementById("spin-btn").addEventListener("click", () => {
    const randomIndex = Math.floor(Math.random() * ranks.length);
    spin(ranks[randomIndex].name, "Player");
});

// OBS
window.addEventListener("message", (event) => {
    if(event.data.type === "spin") {
        spin(event.data.result, event.data.user || "Someone");
    }
});
</script>

</body>
</html>
